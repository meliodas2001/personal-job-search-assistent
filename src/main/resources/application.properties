spring.application.name=PersonalJobHuntAssistent

# PostgreSQL Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/jobhuntdb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings (Auto-creates tables from your @Entity classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

com.file.local.save.path=src/main/resources/resume